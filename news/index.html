<body>
  <header class="topbar">
    <div class="wrap bar">
      <a class="brand" href="../"><img src="../assets/logo.png" alt="SinouLabs"></a>

  <main class="wrap">
    <p class="eyebrow">News</p>
    <h1>AI소식지</h1>
    <p class="lead">매주 월·수·금, AI 소식 하나와 시노우랩스의 생각을 전합니다.</p>
    <ul class="list" id="list"></ul>
  </main>

  <!-- 사업자 정보 표기 (통신판매업 미신고라 신고번호·주소·전화는 생략) -->
  <footer class="wrap foot">
    <dl class="info">
      <div><dt>상호</dt><dd>시노우랩스 (SinouLabs)</dd></div>
      <div><dt>대표자</dt><dd>김현승</dd></div>
      <div><dt>사업자등록번호</dt><dd>871-09-03135</dd></div>
      <div><dt>업종</dt><dd>응용 소프트웨어 개발 및 공급업</dd></div>
      <div><dt>호스팅 제공자</dt><dd>GitHub, Inc. (GitHub Pages)</dd></div>
      <div><dt>문의</dt><dd><a href="mailto:khyunseong9630@gmail.com">khyunseong9630@gmail.com</a></dd></div>
    </dl>
    <div class="foot-bar">
      <span>&copy; 2026 SinouLabs. All rights reserved. · <a class="foot-link" href="../privacy.html">개인정보처리방침</a></span>
      <span data-visit-counter></span>
    </div>
  </footer>
  <script type="module" src="../js/visit-counter.js"></script>

  <script>
    (function(){
      var list = document.getElementById('list');
      // 글 목록 불러와서 최신순으로 표시
      // 새 글이 바로 보이도록 캐시 우회 (브라우저 + GitHub Pages CDN)
      fetch('posts.json?t=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(posts){
        if(!posts.length){
          list.innerHTML = '<li class="empty">아직 글이 없습니다.</li>';
          return;
        }
        posts.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
        posts.forEach(function(p){
          var li = document.createElement('li');
          var a = document.createElement('a');
          a.className = 'item';
          a.href = 'post.html?slug=' + encodeURIComponent(p.slug);
          // textContent로 넣어 XSS 방지
          var h = document.createElement('h2'); h.textContent = p.title;
          var m = document.createElement('div'); m.className = 'meta';
          var d = document.createElement('span'); d.textContent = p.date; m.appendChild(d);
          (p.tags || []).forEach(function(t){
            var tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = t; m.appendChild(tg);
          });
          a.appendChild(h); a.appendChild(m);
          li.appendChild(a); list.appendChild(li);
        });
      }).catch(function(){
        list.innerHTML = '<li class="empty">목록을 불러오지 못했습니다.</li>';
      });
    })();
  </script>
</body>
</html>
