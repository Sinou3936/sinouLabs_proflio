<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI소식지 | 시노우랩스</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="news.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap bar">
      <a class="brand" href="../"><img src="../assets/logo.png" alt="SinouLabs"></a>
      <nav><a href="./">AI소식지</a><a href="../">Home</a></nav>
    </div>
  </header>

  <main class="wrap post">
    <p class="eyebrow">News</p>
    <div class="post-head">
      <h1 id="title">불러오는 중...</h1>
      <div class="meta" id="meta"></div>
    </div>
    <article class="post-body" id="body"></article>
    <a class="back" href="./">← 목록으로</a>
  </main>

  <!-- 사업자 정보 표기 (통신판매업 미신고라 신고번호·주소·전화는 생략) -->
  <footer class="wrap foot">
    <dl class="info">
      <div><dt>상호</dt><dd>시노우랩스 (SinouLabs)</dd></div>
      <div><dt>대표자</dt><dd>김현승</dd></div>
      <div><dt>사업자등록번호</dt><dd>871-09-03135</dd></div>
      <div><dt>업종</dt><dd>응용 소프트웨어 개발 및 공급업</dd></div>
      <div><dt>호스팅 제공자</dt><dd>GitHub, Inc. (GitHub Pages)</dd></div>
      <div><dt>문의</dt><dd><a href="mailto:asd27090@gmail.com">asd27090@gmail.com</a></dd></div>
    </dl>
    <div class="foot-bar">
      <span>&copy; 2026 SinouLabs. All rights reserved. · <a class="foot-link" href="../privacy.html">개인정보처리방침</a></span>
      <span data-visit-counter></span>
    </div>
  </footer>
  <script type="module" src="../js/visit-counter.js"></script>

  <script>
    (function(){
      var slug = new URLSearchParams(location.search).get('slug') || '';
      var titleEl = document.getElementById('title');
      var bodyEl = document.getElementById('body');
      var metaEl = document.getElementById('meta');

      function fail(){
        titleEl.textContent = '글을 찾을 수 없습니다';
        bodyEl.textContent = '';
      }
      // slug는 영문/숫자/하이픈만 허용 (경로 조작 방지)
      if(!/^[a-z0-9-]+$/.test(slug)){ fail(); return; }

      Promise.all([
        // 글 수정 사항이 바로 보이도록 캐시 우회
        fetch('posts.json?t=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.json(); }),
        fetch('posts/' + slug + '.md?t=' + Date.now(), { cache: 'no-store' }).then(function(r){ if(!r.ok) throw 0; return r.text(); })
      ]).then(function(res){
        var post = res[0].filter(function(p){ return p.slug === slug; })[0];
        if(!post){ fail(); return; }
        titleEl.textContent = post.title;
        document.title = post.title + ' | 시노우랩스 AI소식지';
        var d = document.createElement('span'); d.textContent = post.date; metaEl.appendChild(d);
        (post.tags || []).forEach(function(t){
          var tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = t; metaEl.appendChild(tg);
        });
        // 마크다운 변환 후 sanitize
        bodyEl.innerHTML = DOMPurify.sanitize(marked.parse(res[1]));
      }).catch(fail);
    })();
  </script>
</body>
</html>
