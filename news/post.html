<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI소식지 | 시노우랩스</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="news.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap bar">
      <a class="brand" href="../"><img src="../assets/logo.png" alt="SinouLabs"></a>
      <nav><a href="./">AI소식지</a><a href="../">Home</a></nav>
    </div>
  </header>

  <main class="wrap post">
    <p class="eyebrow">News</p>
    <div class="post-head">
      <h1 id="title">불러오는 중...</h1>
      <div class="meta" id="meta"></div>
    </div>
    <article class="post-body" id="body"></article>
    <a class="back" href="./">← 목록으로</a>
  </main>

  <footer class="wrap foot">&copy; 2026 SinouLabs. All rights reserved.</footer>

  <script>
    (function(){
      var slug = new URLSearchParams(location.search).get('slug') || '';
      var titleEl = document.getElementById('title');
      var bodyEl = document.getElementById('body');
      var metaEl = document.getElementById('meta');

      function fail(){
        titleEl.textContent = '글을 찾을 수 없습니다';
        bodyEl.textContent = '';
      }
      // slug는 영문/숫자/하이픈만 허용 (경로 조작 방지)
      if(!/^[a-z0-9-]+$/.test(slug)){ fail(); return; }

      Promise.all([
        fetch('posts.json').then(function(r){ return r.json(); }),
        fetch('posts/' + slug + '.md').then(function(r){ if(!r.ok) throw 0; return r.text(); })
      ]).then(function(res){
        var post = res[0].filter(function(p){ return p.slug === slug; })[0];
        if(!post){ fail(); return; }
        titleEl.textContent = post.title;
        document.title = post.title + ' | 시노우랩스 AI소식지';
        var d = document.createElement('span'); d.textContent = post.date; metaEl.appendChild(d);
        (post.tags || []).forEach(function(t){
          var tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = t; metaEl.appendChild(tg);
        });
        // 마크다운 변환 후 sanitize
        bodyEl.innerHTML = DOMPurify.sanitize(marked.parse(res[1]));
      }).catch(fail);
    })();
  </script>
</body>
</html>
